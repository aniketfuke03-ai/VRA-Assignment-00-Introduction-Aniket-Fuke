name: Submission Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-submission:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate instructor template
        if: github.repository_owner == 'dsvakola'
        run: python scripts/check_submission.py --template

      - name: Check required student assignment fields
        if: github.repository_owner != 'dsvakola'
        run: python scripts/check_submission.py
